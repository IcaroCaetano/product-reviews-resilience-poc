plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.project'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
	resilience4jVersion = '2.2.0'
	wiremockVersion = '3.3.1'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// Resilience4j - integra via starter dedicado para Spring Boot 3+ (anotações + autoconfig).
	// Não é preciso declarar spring-boot-starter-aop à parte: o resilience4j-spring-boot3
	// já traz spring-aop + aspectjweaver como dependências transitivas com versão própria
	// (nessa versão do Spring Boot o starter-aop separado não existe mais no BOM).
	implementation "io.github.resilience4j:resilience4j-spring-boot3:${resilience4jVersion}"

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation "org.wiremock:wiremock-standalone:${wiremockVersion}"
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
