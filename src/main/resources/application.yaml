server:
  port: 8080

spring:
  application:
    name: product-reviews-resilience-poc

app:
  reviews:
    base-url: http://localhost:${server.port}
    connect-timeout: 2s
    read-timeout: 10s


resilience4j:
  circuitbreaker:
    instances:
      reviewsCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 2s
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 5s
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - com.project.product_reviews_resilience_poc.client.ReviewsClientException

  retry:
    instances:
      reviewsRetry:
        maxAttempts: 3
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - com.project.product_reviews_resilience_poc.client.ReviewsClientException

  ratelimiter:
    instances:
      reviewsRateLimiter:
        limitForPeriod: 2
        limitRefreshPeriod: 10s
        timeoutDuration: 0ms

  bulkhead:
    instances:
      reviewsBulkhead:
        maxConcurrentCalls: 2
        maxWaitDuration: 0ms

  timelimiter:
    instances:
      reviewsTimeLimiter:
        timeoutDuration: 1500ms
        cancelRunningFuture: true

management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers,circuitbreakerevents,ratelimiters,bulkheads,retries
  endpoint:
    health:
      show-details: always

logging:
  level:
    io.github.resilience4j: INFO
    com.project.product_reviews_resilience_poc: DEBUG
